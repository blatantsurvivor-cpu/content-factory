
name: Generate Reddit Video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          python -m pip install --upgrade pip
          python -m pip install --upgrade "av>=14,<16" "faster-whisper==1.1.1" "kokoro>=0.9.4" soundfile

      - name: Fetch Reddit story and generate script
        env:
          ASI_ONE_API_KEY: ${{ secrets.ASI_ONE_API_KEY }}
        run: |
          python - <<'PY'
          import os, json, re, urllib.request, xml.etree.ElementTree as ET
          from html import unescape

          key = os.environ.get("ASI_ONE_API_KEY")
          if not key:
              raise SystemExit("Missing ASI_ONE_API_KEY repository secret")

          req = urllib.request.Request(
              "https://www.reddit.com/r/TrueOffMyChest/.rss?sort=top&t=day",
              headers={"User-Agent": "ContentFactory/1.0"}
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              root = ET.fromstring(response.read())

          ns = {"atom": "http://www.w3.org/2005/Atom"}
          entries = root.findall("atom:entry", ns)
          chosen = None

          for entry in entries:
              title = entry.findtext("atom:title", default="", namespaces=ns)
              content = entry.findtext("atom:content", default="", namespaces=ns)
              content = re.sub(r"<[^>]+>", " ", unescape(content))
              content = re.sub(r"\s+", " ", content).strip()
              if len(content) > 200:
                  chosen = (title, content[:12000])
                  break

          if not chosen:
              raise SystemExit("No suitable Reddit story found")

          title, story = chosen
          prompt = f"""
          Write an original, engaging 60-90 second first-person narration
          inspired by this Reddit post. Do not copy it verbatim. Keep it
          coherent and suitable for a general audience. Output only the script.

          Title: {title}
          Post: {story}
          """

          payload = json.dumps({
              "model": "asi1",
              "messages": [{"role": "user", "content": prompt}]
          }).encode()

          request = urllib.request.Request(
              "https://api.asi1.ai/v1/chat/completions",
              data=payload,
              headers={
                  "Authorization": "Bearer " + key,
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          with urllib.request.urlopen(request, timeout=120) as response:
              result = json.loads(response.read())

          script = result["choices"][0]["message"]["content"].strip()
          if not script:
              raise SystemExit("ASI:One returned an empty script")

          with open("script.txt", "w", encoding="utf-8") as f:
              f.write(script + "\n")

          print("Script generated. Words:", len(script.split()))
          PY

     
      - name: Generate voiceover
        run: |
          python -m kokoro \
            --voice am_adam \
            --language a \
            --input-file script.txt \
            --output-file narration.wav

          test -s narration.wav
          echo "Kokoro voiceover generated."


      - name: Render final video with subtitles
        run: |
          curl -fL --retry 3 \
            "https://github.com/blatantsurvivor-cpu/content-factory/releases/download/v1.0/minecraft_test_1080p.mp4" \
            -o gameplay.mp4

          test -s gameplay.mp4

          python - <<'PY'
          from faster_whisper import WhisperModel

          model = WhisperModel("tiny", device="cpu", compute_type="int8")
          segments, _ = model.transcribe("narration.mp3")

          def stamp(seconds):
              ms = round(seconds * 1000)
              h, ms = divmod(ms, 3600000)
              m, ms = divmod(ms, 60000)
              s, ms = divmod(ms, 1000)
              return f"{h:02}:{m:02}:{s:02},{ms:03}"

          count = 0
          with open("subtitles.srt", "w", encoding="utf-8") as f:
              for i, seg in enumerate(segments, 1):
                  text = seg.text.strip()
                  if text:
                      f.write(
                          f"{i}\n{stamp(seg.start)} --> {stamp(seg.end)}\n"
                          f"{text}\n\n"
                      )
                      count += 1

          if count == 0:
              raise SystemExit("Whisper generated no subtitles")
          PY

          ffmpeg -y -stream_loop -1 -i gameplay.mp4 -i narration.mp3 \
            -map 0:v:0 -map 1:a:0 \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,subtitles=subtitles.srt:force_style='FontName=Arial,FontSize=22,Outline=2,Shadow=1,Alignment=2,MarginV=180'" \
            -c:v libx264 -preset ultrafast -crf 23 \
            -pix_fmt yuv420p -c:a aac -b:a 192k \
            -shortest -movflags +faststart final_video.mp4

          test -s final_video.mp4
          echo "Final video created successfully."

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: final_video.mp4
          if-no-files-found: error
          retention-days: 7
