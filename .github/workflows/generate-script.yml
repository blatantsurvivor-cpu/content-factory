name: Generate Reddit Video - Proto 2

on:
  workflow_dispatch:
    inputs:
      subreddit:
        description: "Subreddit to pull a story from"
        default: "TrueOffMyChest"
        type: string
      period:
        description: "Top posts of the..."
        default: "day"
        type: choice
        options: [hour, day, week, month, year, all]
      speed:
        description: "Kokoro-only voice speed (1.0 = normal)"
        default: "1.05"
        type: string
      voice_engine:
        description: "auto uses ElevenLabs if secrets exist; otherwise local Kokoro"
        default: "auto"
        type: choice
        options: [auto, elevenlabs, kokoro]
      output_fps:
        description: "source targets 60 only if every clip is 60fps; forcing 60 on 30fps duplicates frames"
        default: "source"
        type: choice
        options: [source, "30", "60"]

permissions:
  contents: read

concurrency:
  group: reddit-video-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Job 1: story selection + two concurrent writer agents + final script editor.
  # This runs at the same time as gameplay and asset preparation.
  script:
    name: Story and script agents
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile-check all workflow scripts
        run: python -m py_compile scripts/*.py
      - name: Generate Reddit story and edited script
        env:
          ASI_ONE_API_KEY: ${{ secrets.ASI_ONE_API_KEY }}
          SUBREDDIT: ${{ inputs.subreddit }}
          PERIOD: ${{ inputs.period }}
        run: python scripts/story_writer.py
      - name: Save story and script for downstream jobs
        uses: actions/upload-artifact@v4
        with:
          name: story-data
          path: |
            story.json
            script.json
          if-no-files-found: error
          retention-days: 1

  # Job 2: prepare gameplay and optional user-supplied meme/SFX packs in parallel with scripting.
  assets:
    name: Gameplay and asset preparation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg unzip
      - name: Download and prepare gameplay, memes, and sound effects
        env:
          OUTPUT_FPS: ${{ inputs.output_fps }}
        run: python scripts/prepare_assets.py
      - name: Save render assets for downstream job
        uses: actions/upload-artifact@v4
        with:
          name: render-assets
          path: |
            gameplay.mp4
            render-settings.json
            memes/
            sfx/
          if-no-files-found: error
          retention-days: 1

  # Job 3: voice + exact word timing. It starts when script is ready, without waiting for gameplay.
  voice:
    name: Expressive voice and captions
    needs: [script]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-voice.txt
            requirements-kokoro.txt
      - name: Download story/script artifact
        uses: actions/download-artifact@v4
        with:
          name: story-data
          path: .
      - name: Cache local Kokoro/Whisper model files
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: proto2-models-kokoro82m-whisper-base-en-py311-v1
          restore-keys: |
            proto2-models-kokoro82m-whisper-base-en-py311-
      - name: Install voice dependencies
        env:
          VOICE_ENGINE: ${{ inputs.voice_engine }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install --upgrade pip
          # Fail early if ElevenLabs was explicitly requested without both credentials.
          if [[ "$VOICE_ENGINE" == "elevenlabs" && ( -z "$ELEVENLABS_API_KEY" || -z "$ELEVENLABS_VOICE_ID" ) ]]; then
            echo "VOICE_ENGINE=elevenlabs requires ELEVENLABS_API_KEY and ELEVENLABS_VOICE_ID repository secrets."
            exit 1
          fi
          # Timestamped TTS normally avoids ASR; this remains the caption fallback.
          python -m pip install -r requirements-voice.txt
          if [[ "$VOICE_ENGINE" == "elevenlabs" || ( "$VOICE_ENGINE" == "auto" && -n "$ELEVENLABS_API_KEY" && -n "$ELEVENLABS_VOICE_ID" ) ]]; then
            echo "Selected expressive provider: ElevenLabs"
          else
            echo "Selected local fallback: Kokoro"
            python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
            python -m pip install -r requirements-kokoro.txt
          fi
      - name: Generate narration with emotion tags or local Kokoro
        env:
          VOICE_ENGINE: ${{ inputs.voice_engine }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL_ID: eleven_v4
          SPEED: ${{ inputs.speed }}
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
          TTS_WORKERS: "3"
        run: python scripts/voice.py
      - name: Build word-synced karaoke captions
        env:
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
        run: python scripts/captions.py
      - name: Save voice and caption assets
        uses: actions/upload-artifact@v4
        with:
          name: voice-data
          path: |
            narration.wav
            timeline.json
            captions.ass
            word_timings.json
          if-no-files-found: error
          retention-days: 1

  # Job 4: all inputs are ready; center overlays and render the complete video in one output encode.
  render:
    name: Compose and render vertical video
    needs: [script, assets, voice]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-voice.txt
            requirements-kokoro.txt
      - name: Download story and script
        uses: actions/download-artifact@v4
        with:
          name: story-data
          path: .
      - name: Download gameplay and editor asset packs
        uses: actions/download-artifact@v4
        with:
          name: render-assets
          path: .
      - name: Download narration and captions
        uses: actions/download-artifact@v4
        with:
          name: voice-data
          path: .
      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install numpy Pillow
      - name: Compose centered overlays and balance sound effects
        run: python scripts/make_overlays.py
      - name: Render portrait gameplay and validate MP4
        env:
          X264_PRESET: veryfast
          VIDEO_CRF: "18"
        run: python scripts/render_video.py
      - name: Create thumbnail and metadata for debugging
        run: |
          ffmpeg -y -v error -ss 1 -i final_video.mp4 -frames:v 1 -q:v 2 thumb.jpg
          python scripts/metadata.py
      - name: Upload final video only
        uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: final_video.mp4
          if-no-files-found: error
          retention-days: 7
