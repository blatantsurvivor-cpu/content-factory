          PROTO2_BUNDLE
          tr -d '[:space:]' < /tmp/proto2.b64 | base64 -d > /tmp/proto2-runtime.zip
          unzip -oq /tmp/proto2-runtime.zip -d .
          python -m py_compile scripts/*.py
          python -m pip install numpy Pillow requests

      - name: Prepare gameplay and optional meme/SFX packs
        env:
          OUTPUT_FPS: ${{ inputs.output_fps }}
        run: python scripts/prepare_assets.py

      - name: Fetch Reddit story and write script with parallel writer agents
        env:
          ASI_ONE_API_KEY: ${{ secrets.ASI_ONE_API_KEY }}
          SUBREDDIT: ${{ inputs.subreddit }}
          PERIOD: ${{ inputs.period }}
        run: python scripts/story_writer.py

      - name: Install voice engine dependencies
        env:
          VOICE_ENGINE: ${{ inputs.voice_engine }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: |
          set -euo pipefail
          python -m pip install -r requirements-voice.txt
          if [[ "$VOICE_ENGINE" == "elevenlabs" && ( -z "$ELEVENLABS_API_KEY" || -z "$ELEVENLABS_VOICE_ID" ) ]]; then
            echo "elevenlabs mode requires ELEVENLABS_API_KEY and ELEVENLABS_VOICE_ID secrets" >&2
            exit 1
          fi
          if [[ "$VOICE_ENGINE" == "kokoro" || ( "$VOICE_ENGINE" == "auto" && ( -z "$ELEVENLABS_API_KEY" || -z "$ELEVENLABS_VOICE_ID" ) ) ]]; then
            python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
            python -m pip install -r requirements-kokoro.txt
          fi

      - name: Pin and validate spaCy tokenizer model
        run: |
          set -euo pipefail
          python -m pip install --upgrade --force-reinstall \
            "numpy<2" "cymem==2.0.8" "preshed==3.0.9" "murmurhash==1.0.10" \
            "thinc==8.2.5" "spacy==3.7.5"
          python -m pip install --no-deps "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1-py3-none-any.whl"
          python -m pip list | grep -Ei '^(numpy|spacy|thinc|cymem|preshed|murmurhash|blis|srsly|en[-_]core[-_]web[-_]sm) '
          python - <<'PY'
          import spacy
          nlp = spacy.load("en_core_web_sm")
          print(f"spaCy {spacy.__version__}; tokens: {len(nlp('This is a tokenizer test.'))}")
          PY

      - name: Generate expressive narration
        env:
          VOICE_ENGINE: ${{ inputs.voice_engine }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL_ID: eleven_v4
          SPEED: ${{ inputs.speed }}
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
          TTS_WORKERS: "3"
        run: python scripts/voice.py

      - name: Build word-synced captions
        env:
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
        run: python scripts/captions.py

      - name: Compose overlays and render portrait video
        env:
          X264_PRESET: veryfast
          VIDEO_CRF: "18"
        run: |
          set -euo pipefail
          python scripts/make_overlays.py
          python scripts/render_video.py
          ffmpeg -y -v error -ss 1 -i final_video.mp4 -frames:v 1 -q:v 2 thumb.jpg
          python scripts/metadata.py
          test -s final_video.mp4
          ffprobe -v error -show_entries stream=width,height,r_frame_rate -of default=noprint_wrappers=1 final_video.mp4

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: final_video.mp4
          if-no-files-found: error
          retention-days: 7
