name: Reddit Shorts Proto 2

on:
  workflow_dispatch:
    inputs:
      subreddit:
        description: "Subreddit to pull a story from"
        default: "TrueOffMyChest"
        type: string
      period:
        description: "Top posts of the..."
        default: "day"
        type: choice
        options: [hour, day, week, month, year, all]
      speed:
        description: "Voice speed (1.0 = normal)"
        default: "1.05"
        type: string
      voice_engine:
        description: "auto prefers ElevenLabs when secrets exist; otherwise Kokoro"
        default: "auto"
        type: choice
        options: [auto, elevenlabs, kokoro]
      output_fps:
        description: "Output FPS"
        default: "source"
        type: choice
        options: [source, "30", "60"]

permissions:
  contents: read

concurrency:
  group: reddit-video-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    name: Generate complete Proto 2 video
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system tools and create the embedded Proto 2 scripts
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg unzip espeak-ng fonts-dejavu-core
          python -m pip install --upgrade pip
