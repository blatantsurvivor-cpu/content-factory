
name: Generate Reddit Script

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Fetch Reddit story and generate script
        env:
          ASI_ONE_API_KEY: ${{ secrets.ASI_ONE_API_KEY }}
        run: |
          python - <<'PY'
          import os, json, re, urllib.request, xml.etree.ElementTree as ET
          from html import unescape

          if not os.environ.get("ASI_ONE_API_KEY"):
              raise SystemExit("Missing ASI_ONE_API_KEY repository secret")

          feed_url = "https://www.reddit.com/r/TrueOffMyChest/.rss?sort=top&t=day"
          req = urllib.request.Request(
              feed_url,
              headers={"User-Agent": "ContentFactory/1.0"}
          )

          with urllib.request.urlopen(req, timeout=20) as response:
              root = ET.fromstring(response.read())

          ns = {"atom": "http://www.w3.org/2005/Atom"}
          entries = root.findall("atom:entry", ns)

          if not entries:
              raise SystemExit("No Reddit posts found in the RSS feed")

          chosen = None
          for entry in entries:
              title = entry.findtext("atom:title", default="", namespaces=ns)
              content = entry.findtext("atom:content", default="", namespaces=ns)
              content = re.sub(r"<[^>]+>", " ", unescape(content))
              content = re.sub(r"\s+", " ", content).strip()
              if len(content) > 200:
                  chosen = (title, content[:12000])
                  break

          if not chosen:
              raise SystemExit("No suitable story found in today's feed")

          title, story = chosen
          prompt = f"""
          Create an original 60-90 second first-person narration inspired by
          the following Reddit post. Do not copy it verbatim or invent claims
          that the source author definitely made. Make it engaging, coherent,
          and suitable for a general audience. Output only the narration.

          Post title: {title}
          Post content: {story}
          """

          payload = json.dumps({
              "model": "asi1",
              "messages": [
                  {"role": "user", "content": prompt}
              ]
          }).encode()

          api_req = urllib.request.Request(
              "https://api.asi1.ai/v1/chat/completions",
              data=payload,
              headers={
                  "Authorization": "Bearer " + os.environ["ASI_ONE_API_KEY"],
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          with urllib.request.urlopen(api_req, timeout=90) as response:
              result = json.loads(response.read())

          script = result["choices"][0]["message"]["content"].strip()
          if not script:
              raise SystemExit("ASI:One returned an empty script")

          with open("script.txt", "w", encoding="utf-8") as f:
              f.write(script + "\n")

          print("Generated script successfully.")
          print("Word count:", len(script.split()))
          PY
      
      - name: Generate voiceover
        run: |
          pip install edge-tts
          python -m edge_tts \
            --voice en-US-GuyNeural \
            --file script.txt \
            --write-media narration.mp3
          test -s narration.mp3
          echo "Voiceover generated successfully."
      
      - name: Render vertical video
        run: |
              sudo apt-get update
              sudo apt-get install -y ffmpeg
              curl -L "https://github.com/blatantsurvivor-cpu/content-factory/releases/download/v1.0/minecraft_test_1080p.mp4" -o gameplay.mp4

              test -s narration.mp3
              test -s gameplay.mp4

              ffmpeg -y -stream_loop -1 -i gameplay.mp4 -i narration.mp3 \
                -map 0:v:0 -map 1:a:0 \
                -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920" \
                -c:v libx264 -preset ultrafast -pix_fmt yuv420p \
                -c:a aac -b:a 192k -shortest -movflags +faststart \
                final_video.mp4

              test -s final_video.mp4
              echo "Video rendered successfully."
      
       - name: Generate and burn subtitles
         run: |
              pip install faster-whisper

              python - <<'PY'
              from faster_whisper import WhisperModel

              model = WhisperModel("tiny", device="cpu", compute_type="int8")
              segments, info = model.transcribe("narration.mp3")

              def stamp(t):
                  ms = round(t * 1000)
                  h, ms = divmod(ms, 3600000)
                  m, ms = divmod(ms, 60000)
                  s, ms = divmod(ms, 1000)
                  return f"{h:02}:{m:02}:{s:02},{ms:03}"

              with open("subtitles.srt", "w", encoding="utf-8") as f:
                  for i, seg in enumerate(segments, 1):
                      f.write(f"{i}\n{stamp(seg.start)} --> {stamp(seg.end)}\n{seg.text.strip()}\n\n")
              PY

              ffmpeg -y -i final_video.mp4 \
                -vf "subtitles=subtitles.srt:force_style='FontName=Arial,FontSize=18,PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,BorderStyle=1,Outline=2,Alignment=2,MarginV=180'" \
                -c:v libx264 -preset ultrafast -crf 23 \
                -c:a copy -movflags +faststart \
                subtitled_video.mp4

              test -s subtitled_video.mp4
              echo "Subtitled video created."

      - name: Save generated script
        uses: actions/upload-artifact@v4
        with:
          name: generated-script
          path: |
            script.txt
            narration.mp3
            final_video.mp4
          retention-days: 7
